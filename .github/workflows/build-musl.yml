name: build-musl (Termux)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/build-musl.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install cross
        run: cargo install cross --git https://github.com/cross-rs/cross --locked

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: musl-${{ hashFiles('Cargo.lock') }}

      # rusty_v8 150.4.0 ships librusty_v8_release_aarch64-unknown-linux-musl.a.gz,
      # so V8 is prebuilt and no source build is needed.
      - name: Build obscura for aarch64-unknown-linux-musl
        run: |
          cross build \
            --profile release-dist \
            --target aarch64-unknown-linux-musl \
            -p obscura-cli --bins \
            --no-default-features

      - name: Package
        run: |
          mkdir -p dist
          cp target/aarch64-unknown-linux-musl/release-dist/obscura dist/
          cp target/aarch64-unknown-linux-musl/release-dist/obscura-worker dist/
          chmod +x dist/obscura dist/obscura-worker
          ls -l dist/
          file dist/obscura || true
          patchelf --print-interpreter dist/obscura || true

      - uses: actions/upload-artifact@v4
        with:
          name: obscura-aarch64-musl
          path: dist/
          retention-days: 30
