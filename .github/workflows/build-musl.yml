name: build-musl (Termux)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'crates/**'
      - 'ci/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/build-musl.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TARGET: aarch64-unknown-linux-musl
    steps:
      - uses: actions/checkout@v4

      - name: Install cross
        run: cargo install cross --git https://github.com/cross-rs/cross --locked

      - name: Build __clear_cache shim with the cross toolchain
        run: |
          set -eux
          CC_NAME=$(cross sh -c 'echo ${CC_aarch64_unknown_linux_musl:-aarch64-linux-musl-gcc}')
          echo "cross C compiler: $CC_NAME"
          cross sh -c "$CC_NAME -O2 -fno-stack-protector -ffreestanding -c $PWD/ci/clear_cache.c -o $PWD/clear_cache.o"
          file clear_cache.o
          # the symbol must actually be there, or the link will fail the same way
          command -v llvm-nm >/dev/null && llvm-nm clear_cache.o | grep -i clear_cache || nm clear_cache.o | grep -i clear_cache

      - name: Build obscura
        env:
          RUSTFLAGS: -C link-arg=${{ github.workspace }}/clear_cache.o
        run: |
          cross build \
            --profile release-dist \
            --target $TARGET \
            -p obscura-cli --bins \
            --no-default-features

      - name: Package
        run: |
          set -eux
          mkdir -p dist
          cp target/$TARGET/release-dist/obscura dist/
          cp target/$TARGET/release-dist/obscura-worker dist/
          chmod +x dist/obscura dist/obscura-worker
          ls -l dist/
          file dist/obscura
          echo "interpreter: $(patchelf --print-interpreter dist/obscura 2>/dev/null || echo '(static, none)')"

      - uses: actions/upload-artifact@v4
        with:
          name: obscura-aarch64-musl
          path: dist/
          retention-days: 30
