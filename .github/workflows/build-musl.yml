name: build-musl (Termux)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'crates/**'
      - 'ci/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/build-musl.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TARGET: aarch64-unknown-linux-musl
    steps:
      - uses: actions/checkout@v4

      - name: Install cross
        run: cargo install cross --git https://github.com/cross-rs/cross --locked

      # cross only wraps cargo subcommands, so compile the shim with zig cc
      # instead of trying to shell into the cross container.
      - name: Build __clear_cache shim (zig cc -> aarch64-linux-musl)
        run: |
          set -eux
          ZIG_VER=0.13.0
          curl -fsSL "https://ziglang.org/download/${ZIG_VER}/zig-linux-x86_64-${ZIG_VER}.tar.xz" -o zig.tar.xz
          tar xf zig.tar.xz
          ZIG="$(ls -d zig-linux-*/ | head -1)zig"
          "$ZIG" version
          "$ZIG" cc -target aarch64-linux-musl -O2 -fno-stack-protector -ffreestanding \
            -c ci/clear_cache.c -o clear_cache.o
          file clear_cache.o
          nm clear_cache.o | grep -i clear_cache

      - name: Install cross
        if: false
        run: true

      - name: Build obscura
        env:
          RUSTFLAGS: -C link-arg=${{ github.workspace }}/clear_cache.o
        run: |
          cross build \
            --profile release-dist \
            --target $TARGET \
            -p obscura-cli --bins \
            --no-default-features

      - name: Package
        run: |
          set -eux
          mkdir -p dist
          cp target/$TARGET/release-dist/obscura dist/
          cp target/$TARGET/release-dist/obscura-worker dist/
          chmod +x dist/obscura dist/obscura-worker
          ls -l dist/
          file dist/obscura
          echo "interpreter: $(patchelf --print-interpreter dist/obscura 2>/dev/null || echo '(static, none)')"

      - uses: actions/upload-artifact@v4
        with:
          name: obscura-aarch64-musl
          path: dist/
          retention-days: 30
